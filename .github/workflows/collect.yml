name: Collect camera images

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images and pass reports
        env:
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
        run: python3 scripts/collect.py
      - name: Upload to Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/upload_hf.py
      # Short-lived backup copy in case the upload fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cams-${{ github.run_id }}
          path: out/
          retention-days: 3
