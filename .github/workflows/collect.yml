name: Collect camera images and publish site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', '.github/workflows/collect.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images and pass reports
        env:
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
        run: python3 scripts/collect.py
      - name: Upload to Hugging Face dataset
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/upload_hf.py
      - name: Build site
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
