name: Discover keyed feeds (Idaho, Oregon)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/discover.py', '.github/workflows/discover.yml']

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: List passes, nearby cameras and condition feeds
        env:
          IDAHO511_KEY: ${{ secrets.IDAHO511_KEY }}
          ODOT_KEY: ${{ secrets.ODOT_KEY }}
        run: |
          mkdir -p docs/discovery
          python3 scripts/discover.py docs/discovery/feeds.txt
          # safety: never commit a key
          if grep -qF "$IDAHO511_KEY" docs/discovery/feeds.txt || grep -qF "$ODOT_KEY" docs/discovery/feeds.txt; then
            echo "key found in output; not committing"; exit 1; fi
      - name: Commit the listing
        run: |
          git config user.name "conditionsnow-bot"
          git config user.email "hello@conditionsnow.com"
          git add docs/discovery/feeds.txt
          git commit -m "Discovery listing for keyed feeds" || exit 0
          git push
