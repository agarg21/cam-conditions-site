name: Collect camera images and publish site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', 'site/**', '.github/workflows/collect.yml']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images and pass reports
        env:
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
          IDAHO511_KEY: ${{ secrets.IDAHO511_KEY }}
          ODOT_KEY: ${{ secrets.ODOT_KEY }}
        run: python3 scripts/collect.py
      - name: Upload to Hugging Face dataset
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/upload_hf.py
      - name: Load the last day of official status history
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/history.py pull
      - name: Our camera readings (top passes, about hourly in daylight; D9 cap $15/month)
        continue-on-error: true
        timeout-minutes: 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet pillow
          python3 scripts/read_cams.py pull && python3 scripts/read_cams.py read
      - name: Build site
        run: python3 scripts/build_site.py
      - name: Save camera readings
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/read_cams.py push
      - name: Save official status history
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/history.py push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages sometimes lists 0 artifacts right after the upload (GitHub's artifact list lags;
      # 5 failures in a row 2026-11-27 19:12-20:10Z with the artifact present when checked later).
      # The failure happens before a deployment is created, so retrying in the same job is safe.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait longer before the last try
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # GitHub's cron is unreliable on this repo (1 run in 8 h), so each run
  # schedules the next one ~15 min later. The cron above restarts the chain
  # if it ever breaks; the concurrency group keeps it to one run at a time.
  next:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 780
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
