name: Collect camera images

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images and pass reports
        run: python3 scripts/collect.py
      # Temporary home for images until the Hugging Face dataset is set up.
      - uses: actions/upload-artifact@v4
        with:
          name: cams-${{ github.run_id }}
          path: out/
          retention-days: 14
